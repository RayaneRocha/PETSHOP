<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetShop Amigo - Entrar</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/index.html" class="logo">🐾 PetShop <span>Amigo</span></a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="container">
    <section class="auth-card">
      <h1>Entrar</h1>
      <div id="alert" class="alert hidden" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-block" type="submit">Entrar</button>
      </form>
      <p class="hint">Ainda não tem conta? <a href="/cadastro.html">Cadastre-se</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
